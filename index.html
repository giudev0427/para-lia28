<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Para Lia — una pequeña experiencia cinematográfica de café en el espacio.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%95%3C/text%3E%3C/svg%3E">
  <title>Para Lia ☕</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      color-scheme: dark;
      --black: #000000;
      --violet-1: #17111e;
      --violet-2: #21152b;
      --coffee: #6b3e26;
      --gold: #f3c98f;
      --amber: #e69c57;
      --cream: #fff4e4;
      --space: #263b5c;
    }

    * { box-sizing: border-box; }

    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--cream);
      background: var(--black);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    /* ============================================================
       1. PANTALLA DE INICIO (SPLASH)
       ============================================================ */
    .splash {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: var(--black);
      cursor: pointer;
      opacity: 1;
      transform: scale(1);
      filter: blur(0);
      transition: opacity 1s ease, transform 1s ease, filter 1s ease;
    }
    .splash:focus { outline: none; }
    .splash:focus-visible .splash__cta {
      text-decoration: underline;
      text-underline-offset: 6px;
    }

    /* espacio de fondo: estrellas + nebulosas */
    .splash__sky {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse 60% 45% at 50% 46%, rgba(107, 62, 38, .30), transparent 70%),
        radial-gradient(ellipse 70% 55% at 18% 78%, rgba(33, 21, 43, .85), transparent 72%),
        radial-gradient(ellipse 60% 50% at 84% 20%, rgba(38, 59, 92, .34), transparent 72%),
        radial-gradient(ellipse 45% 40% at 50% 12%, rgba(23, 17, 30, .9), transparent 70%),
        var(--black);
    }
    .splash__sky::before,
    .splash__sky::after {
      position: absolute;
      inset: -10%;
      content: "";
      pointer-events: none;
      background-image:
        radial-gradient(1.4px 1.4px at 8% 22%, rgba(255, 244, 228, .9) 50%, transparent 100%),
        radial-gradient(1px 1px at 26% 62%, rgba(243, 201, 143, .8) 50%, transparent 100%),
        radial-gradient(1.6px 1.6px at 42% 14%, rgba(255, 244, 228, .75) 50%, transparent 100%),
        radial-gradient(1px 1px at 58% 74%, rgba(255, 244, 228, .7) 50%, transparent 100%),
        radial-gradient(1.3px 1.3px at 71% 36%, rgba(243, 201, 143, .75) 50%, transparent 100%),
        radial-gradient(1px 1px at 86% 68%, rgba(255, 244, 228, .8) 50%, transparent 100%),
        radial-gradient(1.2px 1.2px at 94% 26%, rgba(255, 244, 228, .7) 50%, transparent 100%),
        radial-gradient(1px 1px at 14% 88%, rgba(255, 244, 228, .65) 50%, transparent 100%);
      background-size: 240px 220px;
      opacity: .75;
      animation: skyDrift 40s linear infinite;
    }
    .splash__sky::after {
      background-size: 330px 300px;
      opacity: .45;
      animation-duration: 68s;
      animation-direction: reverse;
    }
    @keyframes skyDrift {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-40px, -70px, 0); }
    }

    /* taza central */
    .splash__cup {
      position: relative;
      width: clamp(140px, 42vw, 190px);
      aspect-ratio: 1 / 1;
      flex: 0 0 auto;
      transition: transform .8s cubic-bezier(.22, .8, .28, 1), filter .8s ease;
      will-change: transform;
    }
    .splash__float {
      position: absolute;
      inset: 0;
      animation: cupFloat 5.2s ease-in-out infinite;
    }
    .cup__halo {
      position: absolute;
      inset: -34%;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(255, 244, 228, .34) 0%,
        rgba(243, 201, 143, .26) 26%,
        rgba(230, 156, 87, .12) 50%,
        rgba(230, 156, 87, 0) 72%);
      filter: blur(2px);
      animation: haloPulse 4.4s ease-in-out infinite;
    }
    @keyframes haloPulse {
      0%, 100% { transform: scale(1); opacity: .85; }
      50% { transform: scale(1.13); opacity: 1; }
    }
    .cup__glow {
      position: absolute;
      left: 50%;
      bottom: 6%;
      width: 118%;
      height: 26%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(230, 156, 87, .45), rgba(230, 156, 87, 0) 70%);
      filter: blur(6px);
    }
    .cup__body {
      position: absolute;
      left: 50%;
      bottom: 17%;
      width: 62%;
      height: 52%;
      transform: translateX(-50%);
      border-radius: 8% 8% 42% 42% / 6% 6% 26% 26%;
      background: linear-gradient(170deg, #fff8ee 0%, #f0d3ae 42%, #d9ab7c 78%, #b8834f 100%);
      box-shadow:
        inset 0 -14px 26px rgba(107, 62, 38, .38),
        inset 0 6px 14px rgba(255, 255, 255, .5),
        0 24px 46px rgba(230, 156, 87, .3);
    }
    .cup__coffee {
      position: absolute;
      top: -5%;
      left: 4%;
      width: 92%;
      height: 22%;
      border-radius: 50%;
      background: linear-gradient(180deg, #6b3e26, #3a2015);
      box-shadow: inset 0 3px 8px rgba(255, 214, 160, .35);
    }
    .cup__handle {
      position: absolute;
      right: 12%;
      bottom: 30%;
      width: 27%;
      height: 34%;
      border: 8px solid #e7c9a3;
      border-left-color: transparent;
      border-radius: 50%;
      filter: drop-shadow(0 6px 12px rgba(230, 156, 87, .3));
    }
    .cup__steam {
      position: absolute;
      left: 50%;
      bottom: 66%;
      width: 52%;
      height: 30%;
      transform: translateX(-50%);
    }
    .cup__steam span {
      position: absolute;
      bottom: 0;
      width: 8px;
      height: 34px;
      border: 2.5px solid rgba(255, 244, 228, .6);
      border-right-color: transparent;
      border-radius: 50%;
      filter: blur(1px);
      opacity: 0;
      transform: translateY(6px);
      animation: steam 3.4s ease-in-out infinite;
    }
    .cup__steam span:nth-child(1) { left: 12%; animation-delay: 0s; }
    .cup__steam span:nth-child(2) { left: 42%; animation-delay: .55s; height: 44px; }
    .cup__steam span:nth-child(3) { left: 70%; animation-delay: 1.15s; }
    @keyframes steam {
      0% { opacity: 0; transform: translateY(10px) scale(.8); }
      25% { opacity: .85; }
      60% { opacity: .55; }
      100% { opacity: 0; transform: translateY(-30px) scale(1.25) translateX(6px); }
    }
    @keyframes cupFloat {
      0%, 100% { transform: translateY(0) rotate(-2.5deg); }
      50% { transform: translateY(-14px) rotate(2.5deg); }
    }

    .splash__cta {
      flex: 0 0 auto;
      margin: 1.9rem 0 0;
      color: var(--cream);
      font-size: clamp(.86rem, 3.4vw, 1.02rem);
      font-weight: 500;
      letter-spacing: .3em;
      text-align: center;
      text-shadow: 0 0 18px rgba(243, 201, 143, .55);
      animation: breathe 3.6s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { opacity: .55; letter-spacing: .3em; text-shadow: 0 0 12px rgba(243, 201, 143, .3); }
      50% { opacity: 1; letter-spacing: .33em; text-shadow: 0 0 28px rgba(243, 201, 143, .75); }
    }
    .splash__burst {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0);
      background: radial-gradient(circle,
        rgba(255, 255, 255, .95) 0%,
        rgba(255, 244, 228, .7) 22%,
        rgba(243, 201, 143, .38) 45%,
        rgba(230, 156, 87, 0) 72%);
      pointer-events: none;
    }
    .splash.is-glow .splash__cup {
      transform: scale(1.14);
      filter: brightness(1.32) saturate(1.1);
    }
    .splash.is-glow .cup__halo { opacity: 1; }
    .splash.is-burst .splash__burst { animation: burst .95s cubic-bezier(.16, .7, .24, 1) forwards; }
    .splash.is-leaving { opacity: 0; transform: scale(1.07); filter: blur(7px); pointer-events: none; }
    @keyframes burst {
      0% { opacity: .95; transform: translate(-50%, -50%) scale(0); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(260); }
    }

    /* ============================================================
       2. ESCENA ESPACIAL (CANVAS + ORBITAS)
       ============================================================ */
    .space-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100%;
      height: 100%;
      background: var(--black);
    }
    .orbits {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }
    .orb {
      position: absolute;
      left: 0;
      top: 0;
      width: max-content;
      opacity: 0;
      will-change: transform, opacity;
    }
    .orb > span {
      display: block;
      transform: translate(-50%, -50%);
    }
    .orb--phrase > span {
      color: var(--cream);
      font-size: clamp(.68rem, 2.1vw, .82rem);
      font-weight: 500;
      letter-spacing: .1em;
      text-shadow: 0 0 22px rgba(243, 201, 143, .5), 0 0 6px rgba(0, 0, 0, .8);
    }
    .orb--glyph > span {
      font-size: clamp(1.1rem, 3.4vw, 1.5rem);
      line-height: 1;
      filter: drop-shadow(0 0 14px rgba(230, 156, 87, .55));
    }
    /* tazas flotantes adicionales */
    .orb--cup > span {
      font-size: clamp(1.3rem, 3.9vw, 1.8rem);
      filter:
        drop-shadow(0 0 14px rgba(230, 156, 87, .5))
        drop-shadow(0 6px 14px rgba(0, 0, 0, .45));
    }

    /* ============================================================
       3. TARJETA GLASSMORPHISM
       ============================================================ */
    .page {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: clamp(1.1rem, 4vw, 3rem) 1rem;
    }
    .card {
      position: relative;
      width: min(100%, 460px);
      max-width: 100%;
      padding: clamp(1.9rem, 6.5vw, 3.4rem) clamp(1.4rem, 6vw, 2.9rem) clamp(1.6rem, 5vw, 2.4rem);
      overflow: hidden;
      text-align: center;
      border: 1px solid rgba(255, 226, 190, .2);
      border-radius: 2rem;
      background: linear-gradient(150deg, rgba(45, 31, 52, .74), rgba(14, 12, 22, .86));
      box-shadow:
        0 34px 110px rgba(0, 0, 0, .6),
        0 0 0 1px rgba(243, 201, 143, .06),
        inset 0 1px rgba(255, 255, 255, .09);
      backdrop-filter: blur(20px) saturate(130%);
      -webkit-backdrop-filter: blur(20px) saturate(130%);
      opacity: 0;
    }
    .card:focus { outline: none; }
    body.is-live .card { animation: appear .95s cubic-bezier(.2, .8, .24, 1) .05s both; }
    .card::before {
      position: absolute;
      top: -110px;
      left: 50%;
      width: 260px;
      height: 190px;
      content: "";
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(230, 156, 87, .16);
      filter: blur(46px);
      pointer-events: none;
    }
    .card::after {
      position: absolute;
      top: -60%;
      left: -30%;
      width: 60%;
      height: 200%;
      content: "";
      transform: rotate(18deg);
      background: linear-gradient(90deg, transparent, rgba(255, 244, 228, .07), transparent);
      pointer-events: none;
    }
    .eyebrow {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      padding: .5rem .95rem;
      color: var(--gold);
      border: 1px solid rgba(243, 201, 143, .24);
      border-radius: 999px;
      background: rgba(243, 201, 143, .07);
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .19em;
      text-transform: uppercase;
    }
    .coffee-wrap {
      position: relative;
      display: grid;
      width: 150px;
      height: 150px;
      margin: 1.7rem auto 1.4rem;
      place-items: center;
    }
    .orbit {
      position: absolute;
      inset: 2px;
      border: 1px solid rgba(246, 198, 139, .26);
      border-radius: 50%;
      animation: spin 18s linear infinite;
    }
    .orbit--outer {
      inset: -12px;
      border-color: rgba(243, 201, 143, .12);
      border-style: dashed;
      animation-duration: 34s;
      animation-direction: reverse;
    }
    .orbit__dot {
      position: absolute;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 14px var(--gold);
    }
    .orbit__dot:nth-child(1) { top: 12px; left: 24px; width: 8px; height: 8px; }
    .orbit__dot:nth-child(2) { right: 4px; bottom: 34px; width: 5px; height: 5px; opacity: .8; }
    .orbit--outer .orbit__dot { background: var(--amber); box-shadow: 0 0 10px var(--amber); }
    .coffee {
      position: relative;
      font-size: 5.2rem;
      line-height: 1;
      filter: drop-shadow(0 0 22px rgba(243, 201, 143, .45)) drop-shadow(0 10px 22px rgba(230, 156, 87, .3));
      animation: bob 3.6s ease-in-out infinite;
    }
    h1 {
      position: relative;
      margin: 0 0 1rem;
      color: var(--cream);
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(2.1rem, 8.5vw, 3.05rem);
      font-weight: 500;
      line-height: 1.08;
      letter-spacing: -.04em;
      text-shadow: 0 0 34px rgba(243, 201, 143, .28);
    }
    h1 span {
      color: #f1bd7e;
      font-style: italic;
    }
    .message {
      position: relative;
      max-width: 340px;
      margin: 0 auto 1.7rem;
      color: #d9cdd8;
      font-size: clamp(.95rem, 3.5vw, 1.02rem);
      line-height: 1.8;
    }
    .divider {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .55rem;
      width: min(100%, 190px);
      margin: 0 auto 1.2rem;
    }
    .divider::before,
    .divider::after {
      flex: 1;
      height: 1px;
      content: "";
      background: linear-gradient(90deg, transparent, #dca76e, transparent);
    }
    .divider span {
      color: var(--gold);
      font-size: .7rem;
      opacity: .8;
    }
    .spotify {
      position: relative;
      width: 100%;
      max-width: 340px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(0, 0, 0, .5);
    }
    .spotify iframe {
      display: block;
      width: 100%;
      border: 0;
    }
    .player-hint {
      margin: .7rem 0 0;
      color: #a99bb0;
      font-size: .68rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      opacity: .8;
    }
    .player-hint[hidden] { display: none; }

    @keyframes appear {
      from { opacity: 0; transform: translateY(22px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-11px) rotate(4deg); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============================================================
       4. RESPONSIVE
       ============================================================ */
    @media (max-width: 900px) {
      .card { border-radius: 1.7rem; }
      .coffee-wrap { width: 132px; height: 132px; }
      .coffee { font-size: 4.4rem; }
    }
    @media (max-width: 640px) {
      .page { padding: 1.1rem .8rem 1.6rem; }
      .card { padding: 1.7rem 1.15rem 1.3rem; }
      .coffee-wrap { width: 118px; height: 118px; margin: 1.4rem auto 1.1rem; }
      .coffee { font-size: 3.7rem; }
      .message { margin-bottom: 1.3rem; }
      .spotify iframe { height: 132px; }
      .splash__cta { margin-top: 1.5rem; letter-spacing: .24em; }
    }
    @media (max-width: 380px) {
      .spotify iframe { height: 120px; }
      .coffee { font-size: 3.2rem; }
      .orb--cup > span { font-size: 1.1rem; }
    }

    /* ============================================================
       5. ACCESIBILIDAD — MOVIMIENTO REDUCIDO
       ============================================================ */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .28s !important;
        scroll-behavior: auto !important;
      }
      .splash.is-burst .splash__burst { animation: none; opacity: 0; }
    }
  </style>
</head>
<body>
  <!-- ============ PANTALLA DE INICIO ============ -->
  <div id="splash" class="splash" role="button" tabindex="0" aria-label="Toca para iniciar la experiencia">
    <div class="splash__sky" aria-hidden="true"></div>

    <div class="splash__cup" aria-hidden="true">
      <div class="splash__float">
        <div class="cup__halo"></div>
        <div class="cup__steam"><span></span><span></span><span></span></div>
        <div class="cup__body"><div class="cup__coffee"></div></div>
        <div class="cup__handle"></div>
        <div class="cup__glow"></div>
      </div>
    </div>

    <p class="splash__cta" aria-hidden="true">Toca para iniciar</p>
    <div class="splash__burst" aria-hidden="true"></div>
  </div>

  <!-- ============ ESCENA ESPACIAL ============ -->
  <canvas id="space" class="space-canvas" aria-hidden="true"></canvas>
  <div id="orbits" class="orbits" aria-hidden="true"></div>

  <!-- ============ TARJETA ============ -->
  <main class="page">
    <section class="card" aria-labelledby="greeting-title" tabindex="-1">
      <div class="eyebrow"><span aria-hidden="true">✦</span> Un detalle para ti</div>

      <div class="coffee-wrap" aria-hidden="true">
        <div class="orbit"><span class="orbit__dot"></span><span class="orbit__dot"></span></div>
        <div class="orbit orbit--outer"><span class="orbit__dot"></span><span class="orbit__dot"></span></div>
        <div class="coffee">☕</div>
      </div>

      <h1 id="greeting-title">Para <span>Lia</span></h1>
      <p class="message">El café hace más bonito el día, pero tu sonrisa hace más bonito el mundo. Que hoy esté lleno de momentos dulces y de tu bebida favorita.</p>

      <div class="divider" aria-hidden="true"><span>☕</span></div>

      <!-- Reproductor de Spotify -->
      <div class="spotify">
        <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/6IPwKM3fUUzlElbvKw2sKl?utm_source=generator&theme=0" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
      </div>
      <p class="player-hint" hidden>Toca ▶ para escuchar</p>
    </section>
  </main>

  <script>
  (function () {
    'use strict';

    var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var SMALL = Math.min(window.innerWidth, window.innerHeight) < 700;
    var TINY = window.innerWidth < 420;

    /* ------------------------------------------------------------
       Utilidades
       ------------------------------------------------------------ */
    function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function rand(a, b) { return a + Math.random() * (b - a); }

    // Enter y Espacio inician la experiencia (mouse, teclado, touch y lápiz)
    function isStartKey(e) {
      var k = e.key || '', c = e.code || '', kc = e.keyCode || e.which || 0;
      return k === 'Enter' || k === ' ' || k === 'Spacebar' || k === 'Space' ||
        c === 'Enter' || c === 'NumpadEnter' || c === 'Space' ||
        kc === 13 || kc === 32;
    }

    var isTouch = window.matchMedia('(hover: none)').matches;

    /* ------------------------------------------------------------
       PANTALLA DE INICIO
       ------------------------------------------------------------ */
    var splash = document.getElementById('splash');
    var started = false;
    var revealAt = 0;
    var stage = document.getElementById('space');
    var orbitsLayer = document.getElementById('orbits');
    var card = document.querySelector('.card');

    function start() {
      if (started) return;
      started = true;

      splash.classList.add('is-glow');
      splash.classList.add('is-burst');

      // la música empieza con este mismo toque
      musicWanted = true;
      playMusic();

      window.setTimeout(function () {
        splash.classList.add('is-leaving');
        splash.setAttribute('aria-hidden', 'true');
        splash.setAttribute('role', 'presentation');
        splash.removeAttribute('tabindex');
        document.body.classList.add('is-live');
        revealAt = performance.now();
        measureCard();
        if (card && card.focus) { try { card.focus({ preventScroll: true }); } catch (e) { /* noop */ } }
        if (REDUCED) {
          drawStatic();
          placeOrbs(revealAt + 4000);
        } else {
          startLoop();
        }
      }, REDUCED ? 60 : 520);

      window.setTimeout(function () {
        if (splash.parentNode) splash.parentNode.removeChild(splash);
      }, REDUCED ? 420 : 1500);
    }

    splash.addEventListener('click', start);
    splash.addEventListener('keydown', function (e) {
      if (isStartKey(e)) { e.preventDefault(); start(); }
    });
    // Enter / Space también a nivel de documento (por si el foco cambia)
    document.addEventListener('keydown', function (e) {
      if (started) return;
      if (isStartKey(e)) { e.preventDefault(); start(); }
    });
    // Pointer Events cubren ratón, touch y lápiz (móvil / tablet / PC)
    splash.addEventListener('pointerdown', function () { start(); });

    /* ------------------------------------------------------------
       SPOTIFY — la música arranca con el mismo toque.
       Se usa el postMessage del propio reproductor, así el iframe
       original queda intacto (misma canción, mismo reproductor).
       ------------------------------------------------------------ */
    var spotifyFrame = document.querySelector('.spotify iframe');
    var playerHint = document.querySelector('.player-hint');
    var playerReady = false, musicWanted = false, musicHeard = false;

    function showHint(on) { if (playerHint) playerHint.hidden = !on; }

    function toPlayer(command) {
      if (!spotifyFrame || !spotifyFrame.contentWindow) return false;
      try {
        spotifyFrame.contentWindow.postMessage({ command: command }, '*');
        return true;
      } catch (e) { return false; }
    }

    window.addEventListener('message', function (e) {
      if (!spotifyFrame || e.source !== spotifyFrame.contentWindow) return;
      var d = e.data;
      if (!d || !d.type) return;
      if (d.type === 'ready') {
        playerReady = true;
        if (musicWanted) playMusic();
      } else if (d.type === 'playback_started' ||
        (d.type === 'playback_update' && d.payload && d.payload.isPaused === false)) {
        musicHeard = true;
        showHint(false);
      } else if (d.type === 'error') {
        showHint(true);
      }
    });

    function playMusic() {
      if (!musicWanted || musicHeard) return;
      toPlayer('play');
      // el reproductor puede aún no estar listo: se reintenta
      window.setTimeout(function () {
        if (musicWanted && !musicHeard) toPlayer('play_from_start');
      }, 1200);
      // si el navegador bloquea el audio, se indica que puede tocarse ▶
      window.setTimeout(function () {
        if (!musicHeard) showHint(true);
      }, 2800);
    }

    // enganchado desde el inicio: cuando el reproductor avisa que está
    // listo, si Lia ya tocó, la música arranca sola
    window.setTimeout(function () {
      if (musicWanted && !playerReady) playMusic();
    }, 900);

    /* ------------------------------------------------------------
       CANVAS
       ------------------------------------------------------------ */
    var ctx = stage.getContext('2d', { alpha: false });
    var W = 0, H = 0, DPR = 1;
    var cx = 0, cy = 0, R = 120;
    var LENS = 480, TILT = -0.15, FLAT = 0.34;
    var TAU = Math.PI * 2;

    var stars = [];
    var arcs = [];
    var dust = [];
    var orbiters = [];
    var ripples = [];
    var backdrop = null, gradGlow = null, gradCore = null, gradRing = null;
    var sprites = {};

    /* puntero (mouse / touch / stylus) */
    var tx = 0, ty = 0, px = 0, py = 0;

    window.addEventListener('pointermove', function (e) {
      tx = (e.clientX / W - 0.5) * 2;
      ty = (e.clientY / H - 0.5) * 2;
    }, { passive: true });
    window.addEventListener('pointerleave', function () { tx = 0; ty = 0; }, { passive: true });

    // Ondas gravitacionales al tocar el espacio
    window.addEventListener('pointerdown', function (e) {
      if (e.target && e.target.tagName === 'IFRAME') return;
      if (ripples.length > 3) ripples.shift();
      ripples.push({ x: e.clientX, y: e.clientY, t: 0 });
    }, { passive: true });

    // calidad adaptativa: si el dispositivo no da la talla, baja la resolución interna
    var dprCap = Math.min(window.devicePixelRatio || 1, 1.5);
    var dprFloor = 0.75;

    function layout() {
      W = window.innerWidth;
      H = window.innerHeight;
      DPR = Math.max(dprFloor, Math.min(window.devicePixelRatio || 1, dprCap));

      stage.width = Math.max(1, Math.floor(W * DPR));
      stage.height = Math.max(1, Math.floor(H * DPR));
      stage.style.width = W + 'px';
      stage.style.height = H + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

      cx = W / 2;
      cy = H * 0.47;
      var base = Math.min(W, H);
      R = clamp(base * (W < 640 ? 0.145 : 0.175), 58, 210);
      LENS = R * 4.6;
      TILT = W < 640 ? -0.1 : -0.15;

      buildStars();
      buildArcs();
      buildDust();
      buildOrbiters();
      buildSprites();
      buildBackdrop();
      buildGradients();
      measureCard();
      // el lienzo siempre queda coherente con el layout, incluso antes de iniciar
      drawStatic();
      placeOrbs(performance.now());
    }

    /* ---- estrellas con simulación de lente gravitacional ---- */
    function buildStars() {
      var n = TINY ? 100 : SMALL ? 165 : 280;
      stars.length = 0;
      for (var i = 0; i < n; i++) {
        var x = Math.random() * W;
        var y = Math.random() * H;
        var depth = rand(0.35, 1);
        var r = rand(0.5, 1.5) * (0.7 + depth * 0.6);

        // lente: se empujan hacia afuera y se curvan alrededor del agujero negro
        var dx = x - cx, dy = y - cy;
        var d = Math.hypot(dx, dy) || 1;
        var f = clamp(1 - d / LENS, 0, 1);
        var boost = 1;
        if (f > 0) {
          var k = 1 + 1.25 * f * f * f;
          var a = Math.atan2(dy, dx) + 0.26 * f * f;
          var lx = cx + Math.cos(a) * d * k;
          var ly = cy + Math.sin(a) * d * k;
          x = lx; y = ly;
          boost = 1 + 2.2 * f * f;
        }

        stars.push({
          x: x, y: y, r: r, depth: depth, boost: boost,
          a: rand(0.25, 0.9),
          tw: rand(0, Math.PI * 2),
          tws: rand(0.0006, 0.0022),
          warm: Math.random() < 0.22
        });
      }
    }

    /* ---- arcos del disco de acreción ---- */
    function buildArcs() {
      var n = TINY ? 34 : SMALL ? 52 : 74;
      var palette = [
        'rgba(255,244,228,', 'rgba(243,201,143,', 'rgba(230,156,87,',
        'rgba(214,120,58,', 'rgba(168,72,44,'
      ];
      arcs.length = 0;
      for (var i = 0; i < n; i++) {
        var t = i / n;
        var radius = 1.06 + Math.pow(t, 0.72) * 1.95;        // 1.06R -> 3R
        arcs.push({
          r: radius,
          a0: rand(0, TAU),
          span: rand(0.3, 1.6) * (1.25 - t * 0.55),          // arcos más largos lejos
          w: rand(0.006, 0.022),
          c: palette[Math.floor(Math.random() * palette.length)],
          a: rand(0.07, 0.32) * (1.1 - t * 0.55),
          w2: rand(0.4, 1.5),                                // velocidad relativa
          ph: rand(0, TAU)
        });
      }
    }

    /* ---- partículas de polvo alrededor del agujero negro ---- */
    function buildDust() {
      var n = TINY ? 40 : SMALL ? 70 : 130;
      dust.length = 0;
      for (var i = 0; i < n; i++) {
        dust.push({
          r: rand(1.12, 3.1),
          a: rand(0, Math.PI * 2),
          w: rand(0.00022, 0.00075) * (Math.random() < 0.5 ? -1 : 1),
          s: rand(0.5, 1.7),
          a2: rand(0.2, 0.8)
        });
      }
    }

    /* ---- taza, granos y destellos orbitando el disco ---- */
    function buildOrbiters() {
      var glyphs = ['cup', 'cup', 'bean', 'cup', 'star', 'cup', 'bean',
                    'cup', 'cup', 'star', 'cup', 'bean', 'cup'];
      var count = TINY ? 10 : SMALL ? 15 : 22;
      orbiters.length = 0;
      for (var i = 0; i < count; i++) {
        orbiters.push({
          kind: glyphs[i % glyphs.length],
          r: rand(1.35, 2.95),
          a: rand(0, Math.PI * 2),
          w: rand(0.00016, 0.00042) * (Math.random() < 0.5 ? -1 : 1),
          s: rand(0.7, 1.25),
          jit: rand(0, Math.PI * 2)
        });
      }

      // dos tazas protagonistas: una grande y una mediana, con vapor
      var bsBig = TINY ? 52 : SMALL ? 62 : 72;
      var bsMid = TINY ? 34 : SMALL ? 40 : 46;
      orbiters.push({
        kind: 'cupBig', big: true, steam: true, bs: bsBig, s: 1.35,
        r: rand(3.2, 3.55),
        a: rand(0, Math.PI * 2),
        w: -0.000085,
        jit: rand(0, Math.PI * 2)
      });
      orbiters.push({
        kind: 'cup', big: true, steam: true, bs: bsMid, s: 1.1,
        r: rand(2.05, 2.6),
        a: rand(0, Math.PI * 2),
        w: 0.00014,
        jit: rand(0, Math.PI * 2)
      });
    }

    /* ---- fondo pre-renderizado: nebulosas + viñeta (un solo blit) ---- */
    function buildBackdrop() {
      backdrop = document.createElement('canvas');
      backdrop.width = Math.max(1, Math.floor(W / 2));
      backdrop.height = Math.max(1, Math.floor(H / 2));
      var n = backdrop.getContext('2d');
      var w = backdrop.width, h = backdrop.height;
      n.clearRect(0, 0, w, h);

      var blobs = [
        [0.5, 0.42, 0.55, 'rgba(107,62,38,0.30)'],
        [0.16, 0.78, 0.5, 'rgba(33,21,43,0.55)'],
        [0.85, 0.2, 0.48, 'rgba(38,59,92,0.30)'],
        [0.62, 0.86, 0.42, 'rgba(23,17,30,0.6)'],
        [0.3, 0.12, 0.4, 'rgba(230,156,87,0.10)']
      ];
      for (var i = 0; i < blobs.length; i++) {
        var b = blobs[i];
        var x = b[0] * w, y = b[1] * h, r = b[2] * Math.max(w, h);
        var g = n.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, b[3]);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        n.fillStyle = g;
        n.fillRect(0, 0, w, h);
      }

      // viñeta cinematográfica
      var vg = n.createRadialGradient(w / 2, h * 0.48, 0, w / 2, h * 0.48, Math.max(w, h) * 0.78);
      vg.addColorStop(0, 'rgba(0,0,0,0)');
      vg.addColorStop(0.62, 'rgba(0,0,0,0.28)');
      vg.addColorStop(1, 'rgba(0,0,0,0.86)');
      n.fillStyle = vg;
      n.fillRect(0, 0, w, h);
    }

    /* ---- degradados del agujero negro (se crean una sola vez) ---- */
    function buildGradients() {
      var gr = R * 3.9;
      gradGlow = ctx.createRadialGradient(0, 0, R * 0.5, 0, 0, gr);
      gradGlow.addColorStop(0, 'rgba(243,201,143,0.26)');
      gradGlow.addColorStop(0.2, 'rgba(230,156,87,0.15)');
      gradGlow.addColorStop(0.5, 'rgba(107,62,38,0.08)');
      gradGlow.addColorStop(1, 'rgba(0,0,0,0)');

      gradCore = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 1.08);
      gradCore.addColorStop(0, 'rgba(0,0,0,1)');
      gradCore.addColorStop(0.7, 'rgba(0,0,0,1)');
      gradCore.addColorStop(0.9, 'rgba(3,1,6,0.9)');
      gradCore.addColorStop(1, 'rgba(0,0,0,0)');

      // anillo hueco: nunca rellena el núcleo
      gradRing = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 1.55);
      gradRing.addColorStop(0, 'rgba(0,0,0,0)');
      gradRing.addColorStop(0.5, 'rgba(0,0,0,0)');
      gradRing.addColorStop(0.6, 'rgba(255,244,228,0.42)');
      gradRing.addColorStop(0.66, 'rgba(255,244,228,0.2)');
      gradRing.addColorStop(0.78, 'rgba(243,201,143,0.09)');
      gradRing.addColorStop(1, 'rgba(0,0,0,0)');
    }

    /* ---- sprites de los elementos orbitantes (se pintan una vez) ---- */
    function buildSprites() {
      if (sprites.cup) return;
      var S = 96;

      var cup = document.createElement('canvas');
      cup.width = cup.height = S;
      var c = cup.getContext('2d');
      c.font = '54px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.shadowColor = 'rgba(230,156,87,0.9)';
      c.shadowBlur = 14;
      c.fillText('\u2615', S / 2, S / 2);
      sprites.cup = cup;

      // taza grande: sprite propio con halo cálido y brillo suave
      var B = 256;
      var big = document.createElement('canvas');
      big.width = big.height = B;
      var bgc = big.getContext('2d');
      var hg = bgc.createRadialGradient(B / 2, B / 2, 0, B / 2, B / 2, B / 2);
      hg.addColorStop(0, 'rgba(255,244,228,0.30)');
      hg.addColorStop(0.26, 'rgba(243,201,143,0.20)');
      hg.addColorStop(0.52, 'rgba(230,156,87,0.08)');
      hg.addColorStop(1, 'rgba(230,156,87,0)');
      bgc.fillStyle = hg;
      bgc.fillRect(0, 0, B, B);
      bgc.font = '156px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
      bgc.textAlign = 'center';
      bgc.textBaseline = 'middle';
      bgc.shadowColor = 'rgba(255,214,160,0.95)';
      bgc.shadowBlur = 24;
      bgc.fillText('\u2615', B / 2, B / 2 + 10);
      sprites.cupBig = big;

      var bean = document.createElement('canvas');
      bean.width = bean.height = S;
      var b = bean.getContext('2d');
      b.translate(S / 2, S / 2);
      b.scale(3.2, 3.2);
      var bg = b.createLinearGradient(-6, -5, 6, 5);
      bg.addColorStop(0, '#9a6039');
      bg.addColorStop(1, '#4a2818');
      b.fillStyle = bg;
      b.beginPath();
      b.ellipse(0, 0, 7, 4.6, -0.5, 0, TAU);
      b.fill();
      b.strokeStyle = 'rgba(20,10,6,0.7)';
      b.lineWidth = 1.1;
      b.beginPath();
      b.ellipse(0, 0, 6.2, 3.9, -0.5, 0.6, Math.PI - 0.6);
      b.stroke();
      sprites.bean = bean;

      var star = document.createElement('canvas');
      star.width = star.height = S;
      var s = star.getContext('2d');
      s.translate(S / 2, S / 2);
      s.fillStyle = 'rgba(255,244,228,0.95)';
      s.shadowColor = 'rgba(243,201,143,0.95)';
      s.shadowBlur = 12;
      s.beginPath();
      for (var k = 0; k < 4; k++) {
        var ang = (k / 4) * TAU - Math.PI / 2;
        if (k === 0) s.moveTo(Math.cos(ang) * 26, Math.sin(ang) * 26);
        else s.lineTo(Math.cos(ang) * 26, Math.sin(ang) * 26);
        s.lineTo(Math.cos(ang + Math.PI / 4) * 7, Math.sin(ang + Math.PI / 4) * 7);
      }
      s.closePath();
      s.fill();
      sprites.star = star;
    }

    /* ------------------------------------------------------------
       DIBUJO
       ------------------------------------------------------------ */
    function drawSpace(t) {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, W, H);

      if (backdrop) {
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
        ctx.drawImage(backdrop, 0, 0, W, H);
      }

      drawStars(t);
      drawBlackHole(t);
      drawDust(t);
      drawOrbiters(t);
      drawRipples(t);
    }

    function drawStars(t) {
      ctx.globalCompositeOperation = 'source-over';
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        var x = s.x + px * s.depth * 13;
        var y = s.y + py * s.depth * 13;
        var tw = 0.62 + 0.38 * Math.sin(t * s.tws + s.tw);
        var alpha = clamp(s.a * s.boost * tw, 0, 1);

        if (alpha <= 0.02) continue;

        if (s.r > 1.15) {
          ctx.fillStyle = s.warm
            ? 'rgba(255,214,160,' + alpha.toFixed(3) + ')'
            : 'rgba(255,244,228,' + alpha.toFixed(3) + ')';
          ctx.beginPath();
          ctx.arc(x, y, s.r, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = s.warm
            ? 'rgba(255,214,160,' + (alpha * 0.8).toFixed(3) + ')'
            : 'rgba(232,240,255,' + alpha.toFixed(3) + ')';
          ctx.fillRect(x, y, s.r, s.r);
        }
      }
    }

    function drawBlackHole(t) {
      var spin = t * 0.00006 + px * 0.012;
      var tilt = TILT + py * 0.01;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.globalCompositeOperation = 'lighter';

      // resplandor exterior
      var gr = R * 3.9;
      ctx.fillStyle = gradGlow;
      ctx.beginPath();
      ctx.ellipse(0, 0, gr * 1.25, gr * 0.46, 0, 0, TAU);
      ctx.fill();

      // disco de acreción: mitad trasera (detrás del núcleo)
      drawDisk(spin, tilt, false);

      // núcleo completamente oscuro
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = gradCore;
      ctx.beginPath();
      ctx.arc(0, 0, R * 1.08, 0, TAU);
      ctx.fill();

      // anillo de fotones (distorsión de la luz) — hueco, no rellena el núcleo
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = gradRing;
      ctx.beginPath();
      ctx.arc(0, 0, R * 1.55, 0, TAU);
      ctx.fill();

      ctx.lineWidth = Math.max(1, R * 0.012);
      ctx.strokeStyle = 'rgba(255,246,232,0.5)';
      ctx.beginPath();
      ctx.arc(0, 0, R * 1.02, 0, TAU);
      ctx.stroke();

      ctx.lineWidth = Math.max(1, R * 0.05);
      ctx.strokeStyle = 'rgba(243,201,143,0.12)';
      ctx.beginPath();
      ctx.ellipse(0, 0, R * 1.16, R * 1.16, 0, Math.PI * 0.06, Math.PI * 0.94);
      ctx.stroke();

      // disco por delante: pasa por delante del borde inferior del núcleo
      drawDisk(spin, tilt, true);

      ctx.restore();
      ctx.globalCompositeOperation = 'source-over';
    }

    /* Cada arco se pinta una sola vez por fotograma: la mitad trasera antes del
       núcleo (tenue) y la mitad delantera después (brillante). */
    function drawDisk(spin, tilt, front) {
      ctx.globalCompositeOperation = 'lighter';
      var boost = front ? 1.6 : 0.62;
      for (var i = 0; i < arcs.length; i++) {
        var s = arcs[i];
        var a0 = (s.a0 + spin * s.w2) % TAU;
        if (a0 < 0) a0 += TAU;
        var a1 = a0 + s.span;
        var from, to, rr = R * s.r;

        if (front) {
          if (a1 > TAU) { from = 0; to = a1 - TAU; rr = R * s.r * 0.94; }  // envuelve
          else if (a0 < Math.PI) { from = a0; to = Math.min(a1, Math.PI); }
          else continue;
          if (s.r < 1.25) rr *= 0.94;   // los arcos internos cruzan el núcleo
        } else {
          if (a1 <= Math.PI) continue;
          from = Math.max(a0, Math.PI);
          to = Math.min(a1, TAU);
        }
        if (to - from < 0.02) continue;

        var shimmer = 0.74 + 0.26 * Math.sin(spin * 9 + s.ph);
        ctx.globalAlpha = clamp(s.a * boost * shimmer, 0, 0.85);
        ctx.strokeStyle = s.c + '1)';
        ctx.lineWidth = Math.max(0.6, s.w * R);
        ctx.beginPath();
        ctx.ellipse(0, 0, rr, rr * FLAT, tilt, from, to);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    function drawDust(t) {
      ctx.globalCompositeOperation = 'lighter';
      for (var i = 0; i < dust.length; i++) {
        var d = dust[i];
        var a = d.a + t * d.w + px * 0.05;
        var rr = R * d.r;
        var x = Math.cos(a) * rr;
        var y = Math.sin(a) * rr * FLAT;
        var depth = 0.5 + 0.5 * Math.sin(a);
        var alpha = d.a2 * (0.3 + 0.7 * depth) * (0.8 + 0.2 * Math.sin(t * 0.002 + d.a));
        ctx.fillStyle = 'rgba(255,214,160,' + clamp(alpha, 0, 1).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(cx + x, cy + y, d.s * (0.6 + depth * 0.6), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    function drawOrbiters(t) {
      var cos = Math.cos(TILT), sin = Math.sin(TILT);
      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      for (var i = 0; i < orbiters.length; i++) {
        var o = orbiters[i];
        var a = o.a + t * o.w + px * 0.06;
        var rr = R * o.r;
        var depth = (Math.sin(a) + 1) / 2;                 // 0 = atrás, 1 = frente
        var ex = Math.cos(a) * rr;
        var ey = Math.sin(a) * rr * FLAT;
        // inclina la órbita (efecto 3D)
        var x = cx + ex * cos - ey * sin;
        var y = cy + ex * sin + ey * cos;
        var scale = (0.62 + depth * 0.6) * o.s;
        if (o.big) scale *= 1 + 0.06 * Math.sin(t * 0.0011 + o.jit);
        var alpha = (0.2 + depth * 0.75) * (0.85 + 0.15 * Math.sin(t * 0.0015 + o.jit));

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(TILT);
        ctx.globalAlpha = clamp(alpha, 0, 1);
        var sp = sprites[o.kind] || sprites.cup;
        var size = (o.bs || 30) * scale;
        ctx.drawImage(sp, -size / 2, -size / 2, size, size);
        ctx.restore();

        // vapor saliendo de las tazas protagonistas
        if (o.steam) drawSteam(x, y, size, t, o.jit);
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    /* dos hilitos de vapor que suben desde la taza grande */
    function drawSteam(x, y, size, t, ph) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(255,244,228,0.7)';
      ctx.lineCap = 'round';
      ctx.lineWidth = Math.max(1, size * 0.028);
      var top = y - size * 0.3;
      for (var i = 0; i < 2; i++) {
        var p = (t * 0.00028 + i * 0.5 + ph) % 1;
        var rise = -size * (0.05 + p * 0.5);
        var sway = Math.sin(p * 3.4 + i * 2.2) * size * 0.11;
        ctx.globalAlpha = 0.26 * (1 - p) * (1 - p);
        ctx.beginPath();
        ctx.moveTo(x + sway - size * 0.06, top + rise);
        ctx.quadraticCurveTo(
          x + sway + size * 0.07, top + rise - size * 0.13,
          x + sway, top + rise - size * 0.26);
        ctx.stroke();
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    function drawRipples(t) {
      if (!ripples.length) return;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (var i = ripples.length - 1; i >= 0; i--) {
        var r = ripples[i];
        r.t += 0.012;
        if (r.t >= 1) { ripples.splice(i, 1); continue; }
        var rad = r.t * Math.max(W, H) * 0.55;
        ctx.strokeStyle = 'rgba(243,201,143,' + (0.3 * (1 - r.t)).toFixed(3) + ')';
        ctx.lineWidth = 1.6 * (1 - r.t) + 0.4;
        ctx.beginPath();
        ctx.arc(r.x, r.y, rad, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
      ctx.globalCompositeOperation = 'source-over';
    }

    /* ------------------------------------------------------------
       FRASES Y ELEMENTOS ORBITALES (DOM + parallax)
       ------------------------------------------------------------ */
    var PHRASES = [
      { text: 'El café hace más bonito el día', rx: 0.47, ry: 0.40, w: 0.00017, ph: 0.6 },
      { text: 'Tu sonrisa hace más bonito el mundo', rx: 0.53, ry: 0.33, w: -0.00012, ph: 2.4 },
      { text: 'Eres única ✦', rx: 0.41, ry: 0.47, w: 0.00021, ph: 3.9 },
      { text: 'Para Lia ☕', rx: 0.49, ry: 0.29, w: -0.00015, ph: 5.2 },
      { text: 'Gracias por estar ahí', rx: 0.56, ry: 0.45, w: 0.00010, ph: 1.3 }
    ];
    var GLYPHS = [
      { glyph: '☕', rx: 0.43, ry: 0.36, w: -0.00019, ph: 0.9 },
      { glyph: '☕', rx: 0.51, ry: 0.42, w: 0.00014, ph: 3.1 },
      { glyph: '✨', rx: 0.45, ry: 0.31, w: -0.00023, ph: 4.4 },
      { glyph: '🫘', rx: 0.52, ry: 0.47, w: 0.00016, ph: 1.9 },
      { glyph: '💫', rx: 0.38, ry: 0.28, w: -0.00012, ph: 5.6 },
      // más tazas flotando
      { glyph: '☕', rx: 0.35, ry: 0.57, w: 0.00011, ph: 2.2, cls: 'orb--cup' },
      { glyph: '☕', rx: 0.58, ry: 0.29, w: -0.00009, ph: 6.1, cls: 'orb--cup' },
      { glyph: '☕', rx: 0.44, ry: 0.63, w: 0.00013, ph: 3.7, cls: 'orb--cup' },
      { glyph: '☕', rx: 0.57, ry: 0.56, w: -0.00010, ph: 1.4, cls: 'orb--cup' }
    ];

    var orbs = [];

    function createOrbs() {
      orbitsLayer.innerHTML = '';
      orbs.length = 0;

      PHRASES.forEach(function (p) {
        var el = document.createElement('div');
        el.className = 'orb orb--phrase';
        var span = document.createElement('span');
        span.textContent = p.text;
        el.appendChild(span);
        orbitsLayer.appendChild(el);
        orbs.push({ el: el, cfg: p, kind: 'phrase' });
      });

      GLYPHS.forEach(function (g) {
        var el = document.createElement('div');
        el.className = 'orb orb--glyph' + (g.cls ? ' ' + g.cls : '');
        var span = document.createElement('span');
        span.textContent = g.glyph;
        el.appendChild(span);
        orbitsLayer.appendChild(el);
        orbs.push({ el: el, cfg: g, kind: 'glyph' });
      });
    }

    var cardRect = { l: 0, t: 0, r: 0, b: 0 };
    function measureCard() {
      if (!card) return;
      var r = card.getBoundingClientRect();
      cardRect = { l: r.left - 10, t: r.top - 10, r: r.right + 10, b: r.bottom + 10 };
    }

    function placeOrbs(t) {
      var scale = W < 640 ? 0.82 : 1;
      var fade = started ? clamp((t - revealAt) / (REDUCED ? 1 : 1400), 0, 1) : 0;
      for (var i = 0; i < orbs.length; i++) {
        var o = orbs[i];
        var c = o.cfg;
        var a = c.ph + t * c.w;
        var rx = c.rx * W * scale;
        var ry = c.ry * H;
        var depth = (Math.sin(a) + 1) / 2;
        var x = cx + Math.cos(a) * rx + px * (10 + depth * 22);
        var y = cy + Math.sin(a) * ry + py * (8 + depth * 16);
        var s = (0.8 + depth * 0.28);
        o.el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) scale(' + s.toFixed(3) + ')';

        // no estorba la lectura: se atenúa suavemente detrás de la tarjeta
        var behind = 1;
        if (x > cardRect.l && x < cardRect.r && y > cardRect.t && y < cardRect.b) behind = 0.22;
        o.el.style.opacity = ((0.25 + depth * 0.7) * behind * fade).toFixed(3);
      }
    }

    /* ------------------------------------------------------------
       BUCLE PRINCIPAL
       ------------------------------------------------------------ */
    var raf = 0, prev = 0, running = false;
    var ema = 16, slowFrames = 0;

    function startLoop() {
      if (running) return;
      running = true;
      prev = performance.now();
      raf = window.requestAnimationFrame(loop);
    }

    function loop(now) {
      raf = window.requestAnimationFrame(loop);
      if (document.hidden) { prev = now; return; }
      var dt = Math.min(now - prev, 60) || 16;
      prev = now;

      px = lerp(px, tx, 0.045);
      py = lerp(py, ty, 0.045);
      if (!isTouch) {
        tx = lerp(tx, 0, 0.0015);
        ty = lerp(ty, 0, 0.0015);
      }

      drawSpace(now);
      placeOrbs(now);

      // calidad adaptativa: si el equipo no llega, baja la resolución interna
      ema += (dt - ema) * 0.08;
      if (ema > 30) slowFrames++; else if (ema < 22) slowFrames = 0;
      if (slowFrames > 50 && dprCap > 0.8) {
        slowFrames = 0;
        dprCap = dprCap > 1 ? 1 : 0.75;
        layout();
      }
    }

    /* ------------------------------------------------------------
       ARRANQUE / RESIZE
       ------------------------------------------------------------ */
    function drawStatic() {
      drawSpace(0);
      placeOrbs(0);
    }

    createOrbs();
    layout();

    window.addEventListener('resize', function () {
      SMALL = Math.min(window.innerWidth, window.innerHeight) < 700;
      TINY = window.innerWidth < 420;
      layout();
    }, { passive: true });

    window.addEventListener('orientationchange', function () {
      window.setTimeout(layout, 220);
    }, { passive: true });
  })();
  </script>
</body>
</html>
